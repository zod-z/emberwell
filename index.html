<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Emberwell</title>
<link rel="stylesheet" href="css/paint-well.css"/>
<link rel="stylesheet" href="css/paint-kin.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet"/>
<style>
:root{--line:rgba(233,196,106,.34);--cream:#f4ead8;--mute:#c4b39c;--ember:#e85d04;--ember2:#ffb703;--gold:#e9c46a;--safe:max(8px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#070504;color:var(--cream);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
body{display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:#0b0705}
.top{padding:8px 12px 6px}
header{display:flex;justify-content:space-between;align-items:center}
.who{display:flex;align-items:center;gap:8px}
#avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 50% 30%,#f4ead8,#c45c12 40%,#1a0c08)}
.brand{font-family:Fraunces,serif;font-size:20px;font-weight:700;line-height:1}.brand span{color:var(--ember)}
.floor{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ghost{background:0;border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:4px 8px;font:inherit;font-size:10px}
.hud{display:flex;gap:12px;margin-top:6px;font-size:12px;white-space:nowrap}
.hud b{font-weight:700}.hud .g{color:var(--gold)}.hud .r{color:var(--ember2)}.hud .e{color:#7ad7ff}
.hud i{font-style:normal;color:var(--mute);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.tip{margin-top:6px;font-size:11px;color:var(--mute)}.tip b{color:var(--cream)}
main{min-height:0;overflow:hidden;position:relative}
.view{display:none;height:100%;flex-direction:column;min-height:0}.view.on{display:flex}
.stage{flex:1;min-height:0;margin:0 10px;border-radius:16px;border:1px solid var(--line);overflow:hidden;position:relative}
.stage-well{background:radial-gradient(circle at 50% 62%,#c45c12,#0b0705 70%)}
.stage-garden{background:radial-gradient(circle at 50% 40%,#3d5a1f,#1a1408 70%)}
.stage-pit{background:radial-gradient(circle at 50% 60%,#4a1808,#0a0504 70%)}
.title{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;z-index:3;text-shadow:0 1px 4px #000}
.boss-hp{position:absolute;left:18%;right:18%;top:24px;height:6px;background:#2a1010;border:1px solid #7a3030;border-radius:99px;overflow:hidden;z-index:3}
.boss-hp i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#e85d04,#ffb703)}
.hp-lbl{position:absolute;left:0;right:0;top:32px;text-align:center;font-size:9px;color:var(--mute);z-index:3}
.heart{position:absolute;left:50%;top:46%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffd166,#8a4b12);box-shadow:0 0 20px #e85d0466;z-index:2;border:2px solid rgba(233,196,106,.4)}
.heart.dim{filter:grayscale(.5) brightness(.55);box-shadow:none}.heart.hot{box-shadow:0 0 28px #ffb703aa}.heart.hit{animation:hit .25s ease}
@keyframes hit{50%{transform:translate(-50%,-50%) scale(.9)}}
.crew{position:absolute;inset:42px 4px 4px;z-index:3;pointer-events:none}
.seat{position:absolute;width:20%;background:0;border:0;padding:0;color:var(--cream);pointer-events:auto}
.seat:nth-child(1){left:3%;top:2%}.seat:nth-child(2){right:3%;top:2%}.seat:nth-child(3){left:0;top:34%}.seat:nth-child(4){right:0;top:34%}
.seat:nth-child(5){left:6%;bottom:2%}.seat:nth-child(6){right:6%;bottom:2%}.seat:nth-child(7){left:28%;bottom:0}.seat:nth-child(8){right:28%;bottom:0}
.stand{width:100%;aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);background:radial-gradient(circle at 50% 20%,#f4ead8 0 12%,#c45c12 40%,#1a0c08 80%)}
.seat.empty .stand{background:#1a0c0888;border-style:dashed}
.stand.peat{background:radial-gradient(circle at 50% 20%,#e8d2b0 0 12%,#7a4a18 45%,#1a0c08 80%)}
.stand.moth{background:radial-gradient(circle at 50% 20%,#ffd166 0 12%,#d4a017 45%,#1a0c08 80%)}
.stand.owl{background:radial-gradient(circle at 50% 20%,#f4ead8 0 12%,#8a5a20 45%,#1a0c08 80%)}
.seat b,.seat em{display:block;text-align:center;font-style:normal;text-shadow:0 1px 3px #000}.seat b{font-size:8px;margin-top:1px}.seat em{font-size:7px;color:var(--gold)}
.rule{padding:4px 12px 0;font-size:11px;color:var(--mute);text-align:center}
.dock{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:6px 10px}.dock.two{grid-template-columns:1fr 1fr}
.dock button,.seed button,.foe,.ease article,.card,.pack,.upg{border:1px solid var(--line);background:#1a1008cc;color:var(--cream);border-radius:12px;padding:8px;font:inherit;text-align:left}
.dock b,.upg b{display:block;font-size:12px}.dock em,.upg em{display:block;font-style:normal;font-size:9px;color:var(--gold)}
.ups{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 10px 8px}
.hex-field{position:absolute;inset:8% 4% 8%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);gap:6px}
.hex{border:0;border-radius:14px;background:#5a3a1a;position:relative}
.hex:nth-child(1){grid-column:2/4;grid-row:1}.hex:nth-child(2){grid-column:4/6;grid-row:1}.hex:nth-child(3){grid-column:1/3;grid-row:2}.hex:nth-child(4){grid-column:3/5;grid-row:2}.hex:nth-child(5){grid-column:5/7;grid-row:2}.hex:nth-child(6){grid-column:2/4;grid-row:3}.hex:nth-child(7){grid-column:4/6;grid-row:3}
.hex span{position:absolute;left:0;right:0;bottom:0;padding:8px 4px 3px;background:linear-gradient(transparent,#000c);font-size:8px;text-transform:uppercase}
.hex.ripe{box-shadow:0 0 0 2px var(--ember2);background:#7dcf5a}.hex.lock{filter:grayscale(.4);opacity:.7}.hex.sprout{background:#3a5a1a}
.seed{display:flex;gap:6px;padding:0 10px 8px;overflow:auto}.seed button{flex:0 0 auto}.seed .on{outline:1px solid var(--gold)}
.duel{position:absolute;inset:40px 12px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;z-index:3}
.duel .vs{font-family:Fraunces,serif;font-size:20px;color:var(--ember2)}
.face{width:52px;height:52px;margin:0 auto;border-radius:10px;border:1px solid var(--line);background:radial-gradient(circle at 50% 20%,#f4ead8 0 12%,#c45c12 40%,#1a0c08 80%)}
.foes,.ease,.cards,.packs{display:grid;gap:6px;padding:6px 12px 8px;overflow:auto}.packs{grid-template-columns:1fr 1fr}
.card{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center}
.jobs{display:flex;flex-direction:column;gap:3px}
.jobs button{border:1px solid var(--line);background:#1a120c;color:var(--cream);border-radius:8px;padding:4px 6px;font:inherit;font-size:10px;text-transform:uppercase}
.jobs .on{background:#4a1d0c;border-color:var(--ember)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#160e0a;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(var(--safe) + 56px);z-index:25;max-height:70%;overflow:auto}
.sheet[hidden]{display:none !important}.sheet h3{font-family:Fraunces,serif;font-size:20px}.sheet p{color:var(--mute);font-size:13px;margin:6px 0 12px}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.seats button{border:0;background:#2a160e;color:var(--cream);border-radius:12px;padding:8px 6px;font:inherit;font-size:11px}
.seats .up{color:#9ad36a}.seats .down{color:#e08a4a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.row button{border:0;border-radius:12px;padding:12px;font:inherit;background:#2a160e;color:var(--cream)}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:#4a1d0c;border:1px solid var(--ember);padding:8px 14px;border-radius:99px;opacity:0;z-index:30;font-size:13px;pointer-events:none}.toast.on{opacity:1}
nav{display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px var(--safe);background:#080504;border-top:1px solid var(--line);z-index:40}
nav button{background:0;border:0;color:var(--mute);font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 2px}
nav button.on{color:var(--ember2)}nav button em{display:block;color:#8dcf6a;font-style:normal;font-size:8px}
.achs{display:grid;gap:6px;padding:0 12px 12px}
.ach{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--mute)}
.ach.on{color:var(--cream);border-color:var(--gold)}
</style></head>
<body>
<div id="app">
<div class="top">
<header><div class="who"><div id="avatar"></div><div><div class="brand">Ember<span>well</span></div><div class="floor" id="floor">Floor 1</div></div></div><button class="ghost" id="reset">Reset</button></header>
<div class="hud"><span><i>Gather</i><b class="r" id="rate">0/s</b></span><span><i>Gold</i><b class="g" id="gold">0</b></span><span><i>Cinder</i><b id="cinder">0</b></span><span><i>Embers</i><b class="e" id="embersHud">0</b></span></div>
<p class="tip" id="tip" hidden></p>
</div>
<main>
<section class="view on" data-view="well">
  <div class="stage stage-well"><div class="title" id="veinTitle">Ember Heart</div><div class="boss-hp"><i id="veinFill"></i></div><div class="hp-lbl" id="veinHp">0 / 0</div><div class="heart" id="heart"></div><div class="crew" id="crew"></div></div>
  <p class="rule" id="rule">Kin gather gold. Work the heart to go deeper.</p>
  <div class="dock"><button id="collectBtn"><b>Collect</b><em id="cacheLbl">0</em></button><button id="workBtn"><b>Work the heart</b><em id="workLbl">needs a body</em></button><button id="hatchBtn"><b>Hatch</b><em id="hatchLbl">cinder</em></button></div>
  <div class="ups" id="ups"></div>
</section>
<section class="view" data-view="hearth"><div class="stage stage-garden"><div class="hex-field" id="plots"></div></div><p class="rule" id="gardenEta">The beds wait.</p><div class="seed" id="seedRow"></div></section>
<section class="view" data-view="pit"><div class="stage stage-pit"><div class="title">Other dens · rank <span id="pitRank">0</span></div><div class="duel" id="duel"></div></div><div class="dock two"><button id="pitBtn"><b>Meet them</b><em>pit kin vs their den</em></button><button id="rematchBtn"><b>Rematch</b><em>1 ember</em></button></div><p class="rule" id="pitLog">No meeting yet.</p><div class="foes" id="foes"></div></section>
<section class="view" data-view="market"><div class="ease" id="ease"></div><div class="packs" id="packs"></div><div class="dock two"><button id="dailyEmber"><b>Morning embers</b><em>+2 once a day</em></button></div></section>
<section class="view" data-view="you"><p class="rule" id="youLine">Den</p><div class="cards" id="cards"></div><div class="dock two"><button id="prestigeBtn"><b>Bank the well</b><em id="prestigeLbl">floor 10</em></button></div><div class="achs" id="achs"></div></section>
</main>
<div class="sheet" id="sheet" hidden></div><div class="toast" id="toast"></div>
<nav><button class="on" data-tab="well">Well</button><button data-tab="hearth">Hearth<em id="navEta"></em></button><button data-tab="pit">Pit<em id="navPit"></em></button><button data-tab="market">Market</button><button data-tab="you">Den</button></nav>
</div>
<script src="js/game.js"></script>
</body></html>
