<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><title>Emberwell</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet"/><style>:root{--line:rgba(233,196,106,.34);--cream:#f4ead8;--mute:#c4b39c;--ember:#e85d04;--ember2:#ffb703;--gold:#e9c46a;--safe:max(10px,env(safe-area-inset-bottom))}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#070504;color:var(--cream);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}body{display:flex;justify-content:center}#app{width:100%;max-width:430px;height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;background:#0b0705;position:relative}header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 4px;z-index:5}.who{display:flex;align-items:center;gap:8px}#avatar{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 50% 30%,#f4ead8 0 12%,#c45c12 40%,#1a0c08 80%)}.brand{font-family:Fraunces,serif;font-size:22px;font-weight:700;line-height:1}.brand span{color:var(--ember)}.floor{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}.ghost{background:0;border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:6px 10px;font:inherit;font-size:11px}.hud{display:grid;grid-template-columns:1.15fr 1fr 1fr .9fr;gap:5px;padding:2px 10px 8px}.chip{background:#1a1008;border:1px solid var(--line);border-radius:11px;padding:6px 7px}.chip b{display:block;font-size:13px}.chip i{display:block;font-style:normal;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.chip.gold b{color:var(--gold)}.chip.rate b{color:var(--ember2)}.chip.ember b{color:#7ad7ff}main{min-height:0;position:relative;overflow:hidden}.view{display:none;height:100%;flex-direction:column}.view.on{display:flex}.stage{flex:1;position:relative;margin:0 10px;border-radius:18px;border:1px solid var(--line);overflow:hidden}.stage-well{background:radial-gradient(circle at 50% 62%,#c45c12,#0b0705 70%)}.stage-garden{background:radial-gradient(circle at 50% 40%,#3d5a1f,#1a1408 70%)}.stage-pit{background:radial-gradient(circle at 50% 60%,#4a1808,#0a0504 70%)}.title{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;z-index:3}.boss-hp{position:absolute;left:18%;right:18%;top:28px;height:8px;background:#2a1010;border:1px solid #7a3030;border-radius:99px;overflow:hidden;z-index:3}.boss-hp i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#e85d04,#ffb703)}.hp-lbl{position:absolute;left:0;right:0;top:38px;text-align:center;font-size:10px;color:var(--mute);z-index:3}.heart{position:absolute;left:50%;top:48%;width:28%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffd166,#8a4b12);box-shadow:0 0 24px #e85d0466;z-index:2}.heart.dim{filter:grayscale(.5) brightness(.55);box-shadow:none}.heart.hit{animation:hit .25s ease}@keyframes hit{50%{transform:translate(-50%,-50%) scale(.9)}}.crew{position:absolute;inset:52px 4px 8px;z-index:3;pointer-events:none}.seat{position:absolute;width:22%;background:0;border:0;padding:0;color:var(--cream);pointer-events:auto}.seat:nth-child(1){left:4%;top:2%}.seat:nth-child(2){right:4%;top:2%}.seat:nth-child(3){left:0;top:34%}.seat:nth-child(4){right:0;top:34%}.seat:nth-child(5){left:8%;bottom:4%}.seat:nth-child(6){right:8%;bottom:4%}.seat:nth-child(7){left:29%;bottom:0}.seat:nth-child(8){right:29%;bottom:0}.stand{width:100%;aspect-ratio:3/4;border-radius:12px;border:1px solid var(--line);background:radial-gradient(circle at 50% 20%,#f4ead8 0 12%,#c45c12 40%,#1a0c08 80%)}.seat.empty .stand{background:#1a0c0888;border-style:dashed}.stand.peat{background:radial-gradient(circle at 50% 20%,#e8d2b0 0 12%,#7a4a18 45%,#1a0c08 80%)}.stand.moth{background:radial-gradient(circle at 50% 20%,#ffd166 0 12%,#d4a017 45%,#1a0c08 80%)}.stand.owl{background:radial-gradient(circle at 50% 20%,#f4ead8 0 12%,#8a5a20 45%,#1a0c08 80%)}.seat b,.seat em{display:block;text-align:center;font-style:normal}.seat b{font-size:9px;margin-top:2px}.seat em{font-size:8px;color:var(--gold)}.rule{padding:7px 14px 2px;font-size:12px;color:var(--mute);text-align:center}.dock{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:8px 10px}.dock.two{grid-template-columns:1fr 1fr}.dock button,.seed button,.foe,.ease article,.card,.pack{border:1px solid var(--line);background:#1a1008;color:var(--cream);border-radius:14px;padding:10px;font:inherit;text-align:left}.dock b{display:block;font-size:13px}.dock em{display:block;font-style:normal;font-size:10px;color:var(--gold)}.hex-field{position:absolute;inset:8% 4% 8%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);gap:6px}.hex{border:0;border-radius:16px;background:#5a3a1a;position:relative}.hex:nth-child(1){grid-column:2/4;grid-row:1}.hex:nth-child(2){grid-column:4/6;grid-row:1}.hex:nth-child(3){grid-column:1/3;grid-row:2}.hex:nth-child(4){grid-column:3/5;grid-row:2}.hex:nth-child(5){grid-column:5/7;grid-row:2}.hex:nth-child(6){grid-column:2/4;grid-row:3}.hex:nth-child(7){grid-column:4/6;grid-row:3}.hex span{position:absolute;left:0;right:0;bottom:0;padding:10px 4px 4px;background:linear-gradient(transparent,#000c);font-size:9px;text-transform:uppercase}.hex.ripe{box-shadow:0 0 0 2px var(--ember2);background:#7dcf5a}.hex.sprout{background:#3a5a1a}.hex.lock{background:#221c16}.seed{display:flex;gap:6px;padding:0 10px 10px;overflow:auto}.seed button{flex:0 0 auto}.seed .on{outline:1px solid var(--gold)}.duel{position:absolute;inset:48px 12px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;z-index:3}.duel .vs{font-family:Fraunces,serif;font-size:22px;color:var(--ember2)}.duel .face,.face{width:56px;height:56px;margin:0 auto;border-radius:12px;border:1px solid var(--line);background:radial-gradient(circle at 50% 20%,#f4ead8 0 12%,#c45c12 40%,#1a0c08 80%)}.foes,.ease,.cards,.packs{display:grid;gap:8px;padding:8px 12px 12px;overflow:auto}.packs{grid-template-columns:1fr 1fr}.card{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center}.jobs{display:flex;flex-direction:column;gap:4px}.jobs button{border:1px solid var(--line);background:#1a120c;color:var(--cream);border-radius:8px;padding:5px 7px;font:inherit;font-size:10px;text-transform:uppercase}.jobs .on{background:#4a1d0c;border-color:var(--ember)}.sheet{position:absolute;left:0;right:0;bottom:0;background:#160e0a;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(var(--safe) + 64px);z-index:25;max-height:70%;overflow:auto}.sheet[hidden]{display:none !important}.sheet h3{font-family:Fraunces,serif;font-size:22px}.sheet p{color:var(--mute);font-size:13px;margin:6px 0 12px}.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.seats button{border:0;background:#2a160e;color:var(--cream);border-radius:12px;padding:9px 6px;font:inherit;font-size:11px}.seats .up{color:#9ad36a}.seats .down{color:#e08a4a}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.row button{border:0;border-radius:12px;padding:12px;font:inherit;background:#2a160e;color:var(--cream)}.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#4a1d0c;border:1px solid var(--ember);padding:8px 14px;border-radius:99px;opacity:0;z-index:30;font-size:13px;pointer-events:none}.toast.on{opacity:1}nav{display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px var(--safe);background:#080504;border-top:1px solid var(--line);z-index:40;position:relative}nav button{background:0;border:0;color:var(--mute);font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 2px}nav button.on{color:var(--ember2)}nav button em{display:block;color:#8dcf6a;font-style:normal;font-size:8px}</style></head><body><div id="app"><header><div class="who"><div id="avatar"></div><div><div class="brand">Ember<span>well</span></div><div class="floor" id="floor">Floor 1</div></div></div><button class="ghost" id="reset">Reset</button></header><div class="hud"><div class="chip rate"><i>Gather</i><b id="rate">0/s</b></div><div class="chip gold"><i>Gold</i><b id="gold">0</b></div><div class="chip"><i>Cinder</i><b id="cinder">0</b></div><div class="chip ember"><i>Embers</i><b id="embersHud">0</b></div></div><main><section class="view on" data-view="well"><div class="stage stage-well"><div class="title" id="veinTitle">Ember Heart</div><div class="boss-hp"><i id="veinFill"></i></div><div class="hp-lbl" id="veinHp">0 / 0</div><div class="heart" id="heart"></div><div class="crew" id="crew"></div></div><p class="rule" id="rule">Kin gather gold. Work the heart to go deeper.</p><div class="dock"><button id="collectBtn"><b>Collect</b><em id="cacheLbl">0 in basin</em></button><button id="workBtn"><b>Work the heart</b><em id="workLbl">needs a body</em></button><button id="hatchBtn"><b>Hatch</b><em id="hatchLbl">cinder</em></button></div></section><section class="view" data-view="hearth"><div class="stage stage-garden"><div class="hex-field" id="plots"></div></div><p class="rule" id="gardenEta">The beds wait.</p><div class="seed" id="seedRow"></div></section><section class="view" data-view="pit"><div class="stage stage-pit"><div class="title">Other dens · rank <span id="pitRank">0</span></div><div class="duel" id="duel"></div></div><div class="dock two"><button id="pitBtn"><b>Meet them</b><em>your pit kin vs their den</em></button></div><div class="foes" id="foes"></div></section><section class="view" data-view="market"><div class="ease" id="ease"></div><div class="packs" id="packs"></div><div class="dock two"><button id="dailyEmber"><b>Morning embers</b><em>+2 once a day</em></button></div></section><section class="view" data-view="you"><p class="rule" id="youLine">Den</p><div class="cards" id="cards"></div></section></main><div class="sheet" id="sheet" hidden></div><div class="toast" id="toast"></div><nav><button class="on" data-tab="well">Well</button><button data-tab="hearth">Hearth<em id="navEta"></em></button><button data-tab="pit">Pit<em id="navPit"></em></button><button data-tab="market">Market</button><button data-tab="you">Den</button></nav></div><script>(()=>{const SAVE="emberwell.v10";const CAP0=80;const VEINS=["Ember Heart","Peat Core","Kiln Knot","Ash Crown","Nightcoal","Root Furnace","Deep Cinder","White Heat"];const SPECIES=[{id:"pup",name:"Cinderpup"},{id:"peat",name:"Peatling"},{id:"moth",name:"Kilnmoth"},{id:"owl",name:"Emberowl"}];const RARITIES=[{label:"Common",bonus:0,w:52},{label:"Uncommon",bonus:1,w:26},{label:"Rare",bonus:2,w:14},{label:"Ember",bonus:4,w:8}];const FOES=[{id:"mira",name:"Mira of Soot",power:16},{id:"bram",name:"Bram Wellkin",power:26},{id:"noll",name:"Noll Tender",power:40},{id:"kesh",name:"Kesh Ashrank",power:56},{id:"iora",name:"Iora Deep",power:78}];const CROPS={sparkgrass:{name:"Spark",ms:18000,cinder:18,floor:1},peatroot:{name:"Peat",ms:48000,cinder:48,floor:1},kilnwheat:{name:"Kiln",ms:130000,cinder:110,floor:4},nightcoal:{name:"Night",ms:260000,cinder:220,floor:8}};const PACKS=[{id:"spark",name:"Spark Pack",cost:0,gold:160,cinder:50,owned:true},{id:"kindling",name:"Kindling Pack",cost:8,gold:520,cinder:180},{id:"hunter",name:"Hunter Pack",cost:16,gold:1400,cinder:420}];const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const fmt=n=>{n=Math.floor(n||0);return n>=1e4?(n/1e3).toFixed(1)+"k":String(n)};function pickRarity(luck){const bag=RARITIES.map(r=>({...r,w:r.w+luck*r.bonus}));let t=bag.reduce((a,b)=>a+b.w,0),roll=Math.random()*t;for(const r of bag){roll-=r.w;if(roll<=0)return r}return bag[0]}function dpsOf(e){if(!e)return 0;return +((1.4+e.bonus*1.1+(e.lv||1)*0.85+(e.power||0)*4)*(e.mult||1)).toFixed(1)}function atkOf(e){return Math.floor(dpsOf(e)*6+(e.lv||1)*3)}function tendOf(e){return +(0.05+(e.bonus||0)*0.03+(e.lv||1)*0.02).toFixed(2)}function makeKin(p){const spec=p.spec||SPECIES[Math.floor(Math.random()*SPECIES.length)];const r=p.rarity||pickRarity(1);return{id:p.id,spec:spec.id,name:spec.name,rarityLabel:r.label,bonus:r.bonus,power:0.18+r.bonus*0.08+Math.random()*0.12,lv:1,mult:1,job:p.job||null}}function defaultState(){const now=Date.now();const a=makeKin({id:1,spec:SPECIES[0],rarity:RARITIES[1],job:"well"});const b=makeKin({id:2,spec:SPECIES[1],rarity:RARITIES[0],job:"pit"});return{gold:48,cinder:36,embers:14,ash:4,floor:1,luck:1,xp:6,cache:12,veinHp:90,veinMax:90,den:[a,b],slots:[1,0,0,0,0,0,0,0],nextId:3,hatchCount:2,lastSeen:now,seed:"sparkgrass",lastDaily:0,foe:"mira",rank:0,fights:0,packsOwned:["spark"],plots:[1,2,3,4,5,6,7].map(id=>({id,unlocked:id<4,crop:id===1?"sparkgrass":null,doneAt:id===1?now+12000:0}))}}let S=defaultState();function load(){try{const raw=localStorage.getItem(SAVE);if(!raw)return;S={...defaultState(),...JSON.parse(raw)};if(!S.den||!S.den.length)S.den=defaultState().den;if(!S.slots||S.slots.length!==8)S.slots=[1,0,0,0,0,0,0,0];if(S.cache==null)S.cache=0}catch(e){}}function save(){S.lastSeen=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}const kin=id=>S.den.find(e=>e.id===id);const crew=()=>S.slots.map(id=>kin(id)).filter(Boolean);const gather=()=>crew().reduce((a,e)=>a+dpsOf(e),0);const pitPower=()=>S.den.filter(e=>e.job==="pit").reduce((a,e)=>a+atkOf(e),0);const growBonus=()=>Math.max(0.42,1-S.den.filter(e=>e.job==="hearth").reduce((a,e)=>a+tendOf(e),0));const veinMax=()=>Math.floor(90*Math.pow(1.24,S.floor-1));const cap=()=>CAP0+S.floor*8;const hatchCost=()=>Math.floor(12+S.hatchCount*6);const workHit=()=>+(gather()*3.2).toFixed(1);const veinName=()=>VEINS[(S.floor-1)%VEINS.length];function tick(sec){const g=gather();if(g<=0)return;S.cache=Math.min(cap(),S.cache+g*sec)}function toast(m){const el=$("#toast");if(!el)return;el.textContent=m;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),1400)}function closeSheet(){const s=$("#sheet");if(s){s.hidden=true;s.innerHTML=""}}function openSheet(html){const s=$("#sheet");if(!s)return;s.hidden=false;s.innerHTML=html}function show(tab){closeSheet();$$(".view").forEach(v=>v.classList.toggle("on",v.dataset.view===tab));$$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab))}function collect(){const amt=Math.floor(S.cache);if(amt<1)return toast("Basin is empty.");S.gold+=amt;S.cache=0;toast("+"+fmt(amt)+" gold");save();render()}function workHeart(){if(!crew().length)return toast("Seat someone first.");const hit=workHit();S.veinHp=Math.max(0,S.veinHp-hit);S.xp+=2;const h=$("#heart");if(h){h.classList.remove("hit");void h.offsetWidth;h.classList.add("hit")}if(S.veinHp<=0){S.floor+=1;S.xp+=12;S.ash+=1+Math.floor(S.floor/4);S.veinMax=veinMax();S.veinHp=S.veinMax;toast("Floor "+S.floor)}else toast("\u2212"+hit+" on the heart");save();render()}function hatch(){const c=hatchCost();if(S.cinder<c)return toast("Need "+c+" cinder.");S.cinder-=c;S.hatchCount+=1;S.xp+=6;const baby=makeKin({id:S.nextId++,rarity:pickRarity(S.luck)});const d=dpsOf(baby);let seats="";S.slots.forEach((id,i)=>{const cur=kin(id);const curD=cur?dpsOf(cur):0;const diff=d-curD;seats+="<button data-slot='"+i+"' class='"+(diff>=0?"up":"down")+"'>"+(cur?cur.name:"open")+"<br>"+(diff>=0?"+":"")+diff.toFixed(1)+"</button>"});openSheet("<h3>"+baby.name+"</h3><p>"+baby.rarityLabel+" \u00b7 gathers "+d.toFixed(1)+"/s. Seat, keep, or burn.</p><div class='seats'>"+seats+"</div><div class='row'><button id='sellBaby'>Burn \u00b7 +"+(1+baby.bonus)+" ash</button><button id='benchBaby'>Keep in den</button></div>");$$("#sheet [data-slot]").forEach(b=>b.onclick=()=>seat(baby,+b.dataset.slot));const sell=$("#sellBaby"),bench=$("#benchBaby");if(sell)sell.onclick=()=>{S.ash+=1+baby.bonus;closeSheet();toast("Ash.");save();render()};if(bench)bench.onclick=()=>{S.den.unshift(baby);closeSheet();toast("In the den.");save();render()}}function seat(baby,i){const old=kin(S.slots[i]);if(old)old.job=null;if(!S.den.includes(baby))S.den.unshift(baby);baby.job="well";S.slots[i]=baby.id;closeSheet();toast(baby.name+" seated.");save();render()}function tapSeat(i){const e=kin(S.slots[i]);if(!e){const free=S.den.filter(k=>!S.slots.includes(k.id));if(!free.length)return hatch();openSheet("<h3>Open stone</h3><p>Who gathers here?</p><div class='seats'>"+free.map(k=>"<button data-id='"+k.id+"'>"+k.name+"<br>"+dpsOf(k).toFixed(1)+"/s</button>").join("")+"</div>");$$("#sheet [data-id]").forEach(b=>b.onclick=()=>seat(kin(+b.dataset.id),i));return}openSheet("<h3>"+e.name+"</h3><p>"+e.rarityLabel+" \u00b7 lv "+e.lv+" \u00b7 gathers "+dpsOf(e).toFixed(1)+"/s</p><div class='row'><button id='lvl'>Feed ash \u00b7 "+(2+e.lv)+"</button><button id='pull'>Pull off</button></div>");const lvl=$("#lvl"),pull=$("#pull");if(lvl)lvl.onclick=()=>levelKin(e.id);if(pull)pull.onclick=()=>{e.job=null;S.slots[i]=0;closeSheet();save();render()}}function levelKin(id){const e=kin(id);if(!e)return;const c=2+e.lv;if(S.ash<c)return toast("Need "+c+" ash.");S.ash-=c;e.lv+=1;e.mult=+(1+(e.lv-1)*0.12).toFixed(2);toast(e.name+" lv "+e.lv);closeSheet();save();render()}function assign(id,job){const e=kin(id);if(!e)return;if(job==="well"){const empty=S.slots.findIndex(x=>!x);if(empty<0)return toast("Ring is full.");seat(e,empty);return}S.slots=S.slots.map(x=>x===id?0:x);e.job=e.job===job?null:job;save();render()}function plantAll(){const crop=CROPS[S.seed];if(S.floor<crop.floor)return toast("Need floor "+crop.floor);const empty=S.plots.filter(p=>p.unlocked&&!p.crop);if(!empty.length)return toast("No open bed.");empty.forEach(p=>{p.crop=S.seed;p.doneAt=Date.now()+Math.floor(crop.ms*growBonus())});save();render()}function harvestAll(){let n=0;S.plots.forEach(p=>{if(p.crop&&Date.now()>=p.doneAt){S.cinder+=CROPS[p.crop].cinder;p.crop=null;n++}});if(!n)return toast("Nothing ripe.");toast("+"+n+" harvests");save();render()}function tapPlot(id){const p=S.plots.find(x=>x.id===id);if(!p)return;if(!p.unlocked){if(S.gold<80)return toast("80 gold.");S.gold-=80;p.unlocked=true;save();render();return}if(p.crop&&Date.now()>=p.doneAt){S.cinder+=CROPS[p.crop].cinder;p.crop=null;save();render();return}if(!p.crop){const crop=CROPS[S.seed];if(S.floor<crop.floor)return toast("Need floor "+crop.floor);p.crop=S.seed;p.doneAt=Date.now()+Math.floor(crop.ms*growBonus());save();render()}}function fight(){if(!S.den.some(e=>e.job==="pit"))return toast("Send pit kin from Den.");const you=pitPower();const them=Math.floor((FOES.find(f=>f.id===S.foe)||FOES[0]).power*(1+S.floor*0.04));const win=you+Math.random()*8>=them;S.fights+=1;if(win){const ash=2+Math.floor(them/20);S.ash+=ash;S.gold+=10+S.floor*4;S.rank+=1;if(S.rank%3===0)S.embers+=1;toast("Your den held. +"+ash+" ash")}else toast("They held.");save();render()}function buyPack(id){const p=PACKS.find(x=>x.id===id);if(!p)return;if(p.owned||S.packsOwned.includes(id))return toast("Owned.");if(S.embers<p.cost)return toast("Need "+p.cost+" embers.");S.embers-=p.cost;S.gold+=p.gold;S.cinder+=p.cinder;S.packsOwned.push(id);toast("Opened "+p.name);save();render()}function buyEase(kind){if(kind==="luck"){if(S.embers<3)return toast("3 embers");S.embers-=3;S.luck+=1;toast("Luck "+S.luck)}if(kind==="work"){if(S.embers<2)return toast("2 embers");S.embers-=2;workHeart();return}if(kind==="duel"){if(S.embers<2)return toast("2 embers");S.embers-=2;fight();return}save();render()}function claimDaily(){const day=Math.floor(Date.now()/86400000);if(S.lastDaily===day)return toast("Already taken.");S.lastDaily=day;S.embers+=2;toast("+2 embers");save();render()}function nextRipe(){const now=Date.now(),g=S.plots.filter(p=>p.crop&&p.doneAt>now);if(!g.length)return S.plots.some(p=>p.crop&&p.doneAt<=now)?"ripe":"";return Math.max(0,Math.ceil((Math.min(...g.map(p=>p.doneAt))-now)/1000))+"s"}function cropClass(p){if(!p.unlocked)return"lock";if(!p.crop)return"";return Date.now()>=p.doneAt?"ripe":"sprout"}function standClass(spec){return{pup:"",peat:"peat",moth:"moth",owl:"owl"}[spec]||""}function renderHud(){$("#gold").textContent=fmt(S.gold);$("#cinder").textContent=fmt(S.cinder);$("#embersHud").textContent=fmt(S.embers);$("#rate").textContent=gather().toFixed(1)+"/s";$("#floor").textContent="Floor "+S.floor;const vt=$("#veinTitle");if(vt)vt.textContent=veinName()+" \u00b7 F"+S.floor;const vh=$("#veinHp");if(vh)vh.textContent=fmt(S.veinHp)+" / "+fmt(S.veinMax||veinMax());const vf=$("#veinFill");if(vf)vf.style.width=Math.max(0,S.veinHp/(S.veinMax||veinMax())*100)+"%";const heart=$("#heart");if(heart)heart.classList.toggle("dim",!crew().length);const rule=$("#rule");if(rule)rule.textContent=crew().length?("They gather "+gather().toFixed(1)+"/s into the basin. Work the heart to go deeper."):"Empty ring. Seat a body. Nothing burns on its own.";const cache=$("#cacheLbl");if(cache)cache.textContent=fmt(S.cache)+" / "+fmt(cap());const work=$("#workLbl");if(work)work.textContent=crew().length?("\u2212"+workHit()+" per work"):"needs a body";const hatchL=$("#hatchLbl");if(hatchL)hatchL.textContent=hatchCost()+" cinder";const ne=$("#navEta");if(ne)ne.textContent=nextRipe();const np=$("#navPit");if(np)np.textContent=S.rank||"";const you=$("#youLine");if(you)you.textContent="Level "+(1+Math.floor(S.xp/40))+" \u00b7 "+S.den.length+" kin \u00b7 luck "+S.luck+" \u00b7 ash "+fmt(S.ash)}function renderWell(){const box=$("#crew");if(!box)return;box.innerHTML=S.slots.map((id,i)=>{const e=kin(id);if(!e)return"<button class='seat empty' data-i='"+i+"'><div class='stand'></div><b>open</b><em>seat</em></button>";return"<button class='seat' data-i='"+i+"'><div class='stand "+standClass(e.spec)+"'></div><b>"+e.name+"</b><em>"+dpsOf(e).toFixed(1)+"/s</em></button>"}).join("");box.querySelectorAll(".seat").forEach(b=>b.onclick=()=>tapSeat(+b.dataset.i))}function renderHearth(){const wrap=$("#plots");if(!wrap)return;wrap.innerHTML="";S.plots.forEach(p=>{const ready=!!(p.crop&&Date.now()>=p.doneAt);const el=document.createElement("button");el.className="hex "+cropClass(p);el.innerHTML="<span>"+(p.crop&&!ready?Math.max(0,Math.ceil((p.doneAt-Date.now())/1000))+"s":ready?"ripe":p.unlocked?"empty":"sealed")+"</span>";el.onclick=()=>tapPlot(p.id);wrap.appendChild(el)});const row=$("#seedRow");if(!row)return;row.innerHTML="";Object.keys(CROPS).forEach(id=>{const c=CROPS[id],b=document.createElement("button");b.className=S.seed===id?"on":"";b.textContent=S.floor<c.floor?c.name+" F"+c.floor:c.name;b.disabled=S.floor<c.floor;b.onclick=()=>{S.seed=id;save();renderHearth()};row.appendChild(b)});const plant=document.createElement("button");plant.textContent="Plant open";plant.onclick=plantAll;row.appendChild(plant);const harv=document.createElement("button");harv.textContent="Pull ripe";harv.onclick=harvestAll;row.appendChild(harv);const ge=$("#gardenEta");if(ge)ge.textContent=nextRipe()==="ripe"?"Beds are ripe.":(nextRipe()?"Next bed "+nextRipe()+".":"The beds wait.")}function renderPit(){const pr=$("#pitRank");if(pr)pr.textContent=S.rank;const f=FOES.find(x=>x.id===S.foe)||FOES[0];const them=Math.floor(f.power*(1+S.floor*0.04));const duel=$("#duel");if(duel)duel.innerHTML="<div><div class='face'></div><p>"+fmt(pitPower())+" atk</p></div><div class='vs'>vs</div><div><div class='face'></div><p>"+f.name+"<br>"+them+" atk</p></div>";const box=$("#foes");if(!box)return;box.innerHTML="";FOES.forEach(foe=>{const el=document.createElement("button");el.className="foe";el.textContent=foe.name;if(S.foe===foe.id)el.style.outline="1px solid #e9c46a";el.onclick=()=>{S.foe=foe.id;save();renderPit()};box.appendChild(el)})}function renderMarket(){const ease=$("#ease");if(ease){ease.innerHTML="<article><b>Luck</b><em>3 embers \u00b7 better hatches</em><br><button data-ease='luck'>Pay</button></article><article><b>Paid strike</b><em>2 embers \u00b7 one work</em><br><button data-ease='work'>Pay</button></article><article><b>Another meeting</b><em>2 embers \u00b7 extra pit fight</em><br><button data-ease='duel'>Pay</button></article>";ease.querySelectorAll("[data-ease]").forEach(b=>b.onclick=()=>buyEase(b.dataset.ease))}const packs=$("#packs");if(!packs)return;packs.innerHTML="";PACKS.forEach(p=>{const owned=p.owned||S.packsOwned.includes(p.id);const el=document.createElement("article");el.className="pack";el.innerHTML="<b>"+p.name+"</b><em>+"+fmt(p.gold)+"g \u00b7 +"+fmt(p.cinder)+"c</em><br><button></button>";const b=el.querySelector("button");b.textContent=owned?"Owned":p.cost+" embers";b.disabled=owned;b.onclick=()=>buyPack(p.id);packs.appendChild(el)})}function renderYou(){const list=$("#cards");if(!list)return;list.innerHTML="";S.den.forEach(e=>{const el=document.createElement("article");el.className="card";el.innerHTML="<div class='face'></div><div><b>"+e.name+"</b><p>"+e.rarityLabel+" \u00b7 lv"+e.lv+" \u00b7 "+(e.job||"idle")+"<br>gather "+dpsOf(e).toFixed(1)+"/s \u00b7 atk "+atkOf(e)+"</p></div><div class='jobs'></div>";const jobs=el.querySelector(".jobs");["well","hearth","pit"].forEach(job=>{const b=document.createElement("button");b.textContent=job;if(e.job===job)b.className="on";b.onclick=()=>assign(e.id,job);jobs.appendChild(b)});list.appendChild(el)})}function render(){renderHud();renderWell();renderHearth();renderPit();renderMarket();renderYou()}let acc=0;function loop(ts){if(!loop.last)loop.last=ts;const dt=ts-loop.last;loop.last=ts;acc+=dt;if(acc>220){tick(acc/1000);acc=0;renderHud();const hearth=document.querySelector("[data-view=hearth]");if(hearth&&hearth.classList.contains("on"))renderHearth()}requestAnimationFrame(loop)}function bind(id,fn){const el=$(id);if(el)el.onclick=fn}function boot(){load();const elapsed=Math.min(4*3600*1000,Math.max(0,Date.now()-(S.lastSeen||Date.now())));if(elapsed>2000)tick(elapsed/1000);save();render();show("well");bind("#collectBtn",collect);bind("#workBtn",workHeart);bind("#hatchBtn",hatch);bind("#pitBtn",fight);bind("#dailyEmber",claimDaily);document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b)show(b.dataset.tab)});bind("#reset",()=>{localStorage.removeItem(SAVE);localStorage.removeItem("emberwell.v9");localStorage.removeItem("emberwell.v8");S=defaultState();save();render();show("well")});document.addEventListener("pointerdown",e=>{const sheet=$("#sheet");if(sheet&&!sheet.hidden&&!e.target.closest(".sheet")&&!e.target.closest(".seat"))closeSheet()});requestAnimationFrame(loop);setInterval(save,4000)}boot()})();</script></body></html>
