<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Emberwell</title>
<link rel="stylesheet" href="css/game.css" />
</head>
<body>
<div id="app">
<header>
  <div class="who">
    <div id="avatar" class="kin kin-pup sm"></div>
    <div>
      <div class="brand">Ember<span>well</span></div>
      <div class="floor" id="floor">Floor 1 · slice 8</div>
    </div>
  </div>
  <div class="hud">
    <b id="rate">0/s</b>
    <b id="gold">0</b>
    <b id="cinder">0</b>
    <b id="embersHud">8</b>
  </div>
  <button class="ghost" id="reset">Reset</button>
</header>
<main>
<section class="view on" data-view="well">
  <div class="well-stage" id="well-stage">
    <div class="smoke"></div>
    <div class="vein-title" id="veinTitle">Ember Heart</div>
    <div class="boss-hp"><i id="veinFill"></i></div>
    <div class="vein-hp" id="veinHp">80</div>
    <button class="heart" id="heart" aria-label="tend the heart"></button>
    <div class="float-dmg" id="floatDmg"></div>
    <div class="crew" id="crew"></div>
    <p class="whisper" id="whisper">Seat a body. The well only works if someone stands in it.</p>
  </div>
</section>
<section class="view" data-view="hearth">
  <div class="garden-stage">
    <div class="hex-field" id="plots"></div>
    <p class="whisper" id="gardenEta">The beds wait.</p>
  </div>
  <div class="seed-row" id="seedRow"></div>
</section>
<section class="view" data-view="pit">
  <div class="pit-stage">
    <div class="pit-title">Other dens · rank <span id="pitRank">0</span></div>
    <div class="duel" id="duel"></div>
    <button class="wide" id="pitBtn">Meet them</button>
  </div>
  <div class="foes" id="foes"></div>
</section>
<section class="view" data-view="market">
  <div class="ease" id="ease"></div>
  <button class="wide ember" id="dailyEmber">Morning embers</button>
</section>
<section class="view" data-view="you">
  <p class="whisper pad" id="youLine">Level 1</p>
  <div class="cards" id="cards"></div>
</section>
</main>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast"></div>
<nav>
  <button class="on" data-tab="well">Well</button>
  <button data-tab="hearth">Hearth<em id="navEta"></em></button>
  <button data-tab="pit">Pit<em id="navPit"></em></button>
  <button data-tab="market">Market</button>
  <button data-tab="you">Den</button>
</nav>
</div>
<script src="js/game.js"></script>
</body>
</html>
